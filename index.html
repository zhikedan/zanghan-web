<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>藏汉翻译通 · 网页版</title>
<style>
:root{
  --bg:#f4f6fb; --card:#fff; --ink:#1b2432; --sub:#6b7688; --line:#e3e8f2;
  --brand:#2f7cf6; --brand2:#4aa3ff; --ok:#12a97a; --warn:#e8a33d; --err:#e05561;
  --radius:16px; --shadow:0 6px 24px rgba(30,50,90,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:"Segoe UI","Microsoft YaHei","PingFang SC","Noto Sans Tibetan",sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.6;
  padding:0 0 40px;
}
.bo{font-family:"Noto Serif Tibetan","Microsoft Himalaya","Kailasa",serif;font-size:1.15em;line-height:1.9}

/* ---------- 顶栏 ---------- */
header{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(135deg,#2f7cf6,#4aa3ff);
  color:#fff;padding:14px 18px;box-shadow:0 3px 16px rgba(47,124,246,.28);
}
.hd{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.2);
  display:grid;place-items:center;font-size:20px;flex:0 0 auto}
.tt{flex:1;min-width:0}
.tt h1{margin:0;font-size:17px;font-weight:650;letter-spacing:.2px}
.tt p{margin:1px 0 0;font-size:11.5px;opacity:.86}
.badge{font-size:11px;background:rgba(255,255,255,.22);padding:3px 9px;border-radius:9px;white-space:nowrap}

/* ---------- 主体 ---------- */
main{max-width:900px;margin:16px auto 0;padding:0 14px}

/* Tab */
.tabs{display:flex;gap:6px;background:#e8edf7;padding:5px;border-radius:14px;margin-bottom:14px;
  overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;border:0;background:transparent;color:var(--sub);font:inherit;font-size:13.5px;
  padding:9px 14px;border-radius:10px;cursor:pointer;white-space:nowrap;transition:.18s}
.tab.on{background:#fff;color:var(--brand);font-weight:650;box-shadow:0 2px 8px rgba(47,124,246,.16)}

/* 卡片 */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:16px;margin-bottom:14px;border:1px solid rgba(227,232,242,.7)}
.card h2{margin:0 0 12px;font-size:14px;font-weight:650;color:var(--sub);letter-spacing:.3px;
  display:flex;align-items:center;gap:7px}

/* 输入 */
textarea,input[type=text]{
  width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;
  font:inherit;font-size:15px;resize:vertical;background:#fbfcfe;transition:.18s;color:var(--ink);
}
textarea:focus,input:focus{outline:0;border-color:var(--brand);background:#fff;
  box-shadow:0 0 0 3px rgba(47,124,246,.11)}
textarea{min-height:110px}

/* 按钮 */
.btn{
  border:0;border-radius:11px;padding:11px 20px;font:inherit;font-size:14.5px;font-weight:640;
  cursor:pointer;transition:.16s;background:var(--brand);color:#fff;
}
.btn:hover{background:#2468d8}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:#eef3fd;color:var(--brand)}
.btn.ghost:hover{background:#e2ecfc}
.btn.sm{padding:7px 13px;font-size:13px;border-radius:9px}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.grow{flex:1}

/* 语言选择 */
.langs{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.langs select{
  flex:1;border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;
  font:inherit;font-size:14px;background:#fbfcfe;color:var(--ink);cursor:pointer;
}
.swap{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:#fff;
  cursor:pointer;font-size:16px;color:var(--brand);flex:0 0 auto;display:grid;place-items:center}
.swap:hover{background:#eef3fd}

/* 结果 */
.result{margin-top:13px;padding:14px;border-radius:12px;background:#f7faff;
  border:1px solid #dfe9fb;min-height:52px;font-size:15px;white-space:pre-wrap;word-break:break-word}
.result.empty{color:#9aa6ba;font-size:13.5px;display:grid;place-items:center}
.result.err{background:#fff5f6;border-color:#ffd9dd;color:var(--err)}

/* 词典条目 */
.ditem{padding:13px 0;border-bottom:1px solid #eef1f7}
.ditem:last-child{border-bottom:0}
.dhead{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.dbo{font-size:19px;font-weight:600;color:var(--brand)}
.dzh{font-size:15px;color:var(--ink)}
.dpy{font-size:12.5px;color:var(--sub);font-family:ui-monospace,monospace}
.dtag{font-size:10.5px;padding:2px 7px;border-radius:6px;background:#eaf1fe;color:#3b76d1;white-space:nowrap}
.dtag.big{background:#fdf1e3;color:#c07a17}
.dtag.terms{background:#e9f8f1;color:#0e8f66}
.dbody{margin-top:5px;font-size:13.5px;color:#54607a}
.dsrc{font-size:11.5px;color:#9aa6ba;margin-top:4px}

/* 空态 */
.empty-state{text-align:center;padding:34px 16px;color:#9aa6ba}
.empty-state .ic{font-size:38px;opacity:.45;margin-bottom:8px}
.empty-state p{margin:5px 0;font-size:13.5px}

/* 状态点 */
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}
.dot.ok{background:var(--ok)} .dot.no{background:var(--err)} .dot.warn{background:var(--warn)}

/* 语音 */
.rec{display:grid;place-items:center;padding:22px 0}
.mic{
  width:82px;height:82px;border-radius:50%;border:0;cursor:pointer;
  background:linear-gradient(135deg,#2f7cf6,#4aa3ff);color:#fff;font-size:32px;
  box-shadow:0 8px 26px rgba(47,124,246,.34);transition:.2s;
}
.mic:hover{transform:scale(1.04)}
.mic.on{background:linear-gradient(135deg,#e05561,#f0787f);animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 8px 26px rgba(224,85,97,.4)}50%{box-shadow:0 8px 40px rgba(224,85,97,.75)}}
.hint{font-size:12.5px;color:var(--sub);text-align:center;margin-top:10px}

/* OCR */
.drop{
  border:2px dashed #c9d7ee;border-radius:14px;padding:26px 16px;text-align:center;
  color:var(--sub);cursor:pointer;transition:.18s;background:#fbfcfe;
}
.drop:hover,.drop.over{border-color:var(--brand);background:#f2f7ff;color:var(--brand)}
.drop .ic{font-size:34px;opacity:.6;margin-bottom:6px}
#ocrPreview{max-width:100%;border-radius:12px;margin-top:12px;display:none}

/* 加载 */
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);
  border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;margin-right:7px;vertical-align:-2px}
.spin.dark{border-color:rgba(47,124,246,.25);border-top-color:var(--brand)}
@keyframes sp{to{transform:rotate(360deg)}}

/* 历史 */
.hist{display:flex;flex-wrap:wrap;gap:7px}
.hchip{font-size:12.5px;padding:5px 11px;border-radius:8px;background:#eef3fd;color:#3b76d1;
  cursor:pointer;border:0;font-family:inherit}
.hchip:hover{background:#e0ebfc}

/* 面板显隐 */
.panel{display:none}
.panel.on{display:block;animation:fade .22s}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* 提示条 */
.toast{
  position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);
  background:#1b2432;color:#fff;padding:11px 20px;border-radius:11px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:.26s;z-index:99;max-width:80vw;text-align:center;
}
.toast.on{opacity:1;transform:translateX(-50%)}

@media(max-width:560px){
  main{padding:0 10px}
  .card{padding:14px;border-radius:14px}
  .tt h1{font-size:15.5px}
  .badge{display:none}
}
</style>
</head>
<body>

<header>
  <div class="hd">
    <div class="logo">བ</div>
    <div class="tt">
      <h1>藏汉翻译通 · 网页版</h1>
      <p>无广告 · 免登录 · 不限次数</p>
    </div>
    <span class="badge" id="statusBadge">检测中…</span>
  </div>
</header>

<main>

  <div class="tabs" id="tabs">
    <button class="tab on" data-tab="dict">词典</button>
    <button class="tab" data-tab="trans">翻译</button>
    <button class="tab" data-tab="ocr">拍照识别</button>
    <button class="tab" data-tab="asr">语音识别</button>
    <button class="tab" data-tab="tts">朗读</button>
  </div>

  <!-- ============ 词典 ============ -->
  <section class="panel on" id="panel-dict">
    <div class="card">
      <h2>🔍 查词</h2>
      <div class="row">
        <input type="text" id="dictInput" class="grow" placeholder="输入藏文 / 中文 / 拼音，回车查询"
               autocomplete="off" spellcheck="false">
        <button class="btn" id="dictBtn">查询</button>
      </div>
      <div class="row" style="margin-top:10px;gap:6px">
        <button class="btn ghost sm" data-src="big">藏汉大辞典</button>
        <button class="btn ghost sm" data-src="words">藏汉词典</button>
        <button class="btn ghost sm" data-src="terms">新术语</button>
      </div>
    </div>

    <div class="card">
      <h2>📖 结果 <span id="dictCount" style="font-weight:400;color:#9aa6ba"></span></h2>
      <div id="dictResult">
        <div class="empty-state">
          <div class="ic">📚</div>
          <p>输入词语开始查询</p>
          <p style="font-size:12px">支持藏文、中文、拼音三种方式</p>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ 翻译 ============ -->
  <section class="panel" id="panel-trans">
    <div class="card">
      <h2>🌐 文字翻译</h2>
      <div class="langs">
        <select id="fromLang">
          <option value="zh-Hans">中文（简体）</option>
          <option value="bo">藏文 བོད་སྐད་</option>
          <option value="en">英语</option>
          <option value="auto">自动检测</option>
        </select>
        <button class="swap" id="swapLang" title="交换语言">⇄</button>
        <select id="toLang">
          <option value="bo">藏文 བོད་སྐད་</option>
          <option value="zh-Hans">中文（简体）</option>
          <option value="en">英语</option>
        </select>
      </div>
      <textarea id="transInput" placeholder="输入要翻译的文字…"></textarea>
      <div class="row end" style="margin-top:11px">
        <button class="btn ghost sm" id="transClear">清空</button>
        <button class="btn" id="transBtn">翻译</button>
      </div>
      <div class="result empty" id="transResult">翻译结果会显示在这里</div>
      <div class="row" style="margin-top:10px">
        <button class="btn ghost sm" id="transCopy">复制</button>
        <button class="btn ghost sm" id="transSpeak">🔊 朗读</button>
        <button class="btn ghost sm" id="transToDict">查词典</button>
      </div>
    </div>
  </section>

  <!-- ============ OCR ============ -->
  <section class="panel" id="panel-ocr">
    <div class="card">
      <h2>📷 拍照 / 图片识别</h2>
      <div class="drop" id="ocrDrop">
        <div class="ic">🖼️</div>
        <div>点击选择图片，或把图片拖到这里</div>
        <div style="font-size:12px;margin-top:5px;opacity:.75">支持 JPG / PNG，本地识别不上传</div>
      </div>
      <input type="file" id="ocrFile" accept="image/*" style="display:none">
      <img id="ocrPreview" alt="预览">
      <div class="row" style="margin-top:12px">
        <select id="ocrLang" style="flex:1;border:1.5px solid var(--line);border-radius:11px;padding:10px;font:inherit">
          <option value="chi_sim+tib">中文 + 藏文</option>
          <option value="chi_sim">仅中文</option>
          <option value="tib">仅藏文</option>
          <option value="eng">仅英文</option>
        </select>
        <button class="btn" id="ocrBtn" disabled>开始识别</button>
      </div>
      <div class="result empty" id="ocrResult">识别结果会显示在这里</div>
      <div class="hint" id="ocrHint">首次使用需下载识别语言包（约 10–20 MB），之后离线可用</div>
    </div>
  </section>

  <!-- ============ ASR ============ -->
  <section class="panel" id="panel-asr">
    <div class="card">
      <h2>🎤 语音识别</h2>
      <div class="rec">
        <button class="mic" id="micBtn">🎤</button>
        <div class="hint" id="micHint">点击开始说话</div>
      </div>
      <div class="result empty" id="asrResult">识别结果会显示在这里</div>
      <div class="row" style="margin-top:10px">
        <button class="btn ghost sm" id="asrCopy">复制</button>
        <button class="btn ghost sm" id="asrTrans">翻译这段</button>
      </div>
    </div>
  </section>

  <!-- ============ TTS ============ -->
  <section class="panel" id="panel-tts">
    <div class="card">
      <h2>🔊 文字朗读</h2>
      <textarea id="ttsInput" placeholder="输入要朗读的文字（中文 / 藏文 / 英文）"></textarea>
      <div class="row" style="margin-top:11px">
        <select id="ttsVoice" style="flex:1;border:1.5px solid var(--line);border-radius:11px;padding:10px;font:inherit"></select>
        <input type="range" id="ttsRate" min="0.5" max="1.8" step="0.1" value="1" style="width:100px">
        <span id="ttsRateVal" style="font-size:13px;color:var(--sub);min-width:34px">1.0×</span>
      </div>
      <div class="row end" style="margin-top:11px">
        <button class="btn ghost sm" id="ttsStop">停止</button>
        <button class="btn" id="ttsPlay">开始朗读</button>
      </div>
      <div class="hint" id="ttsHint">
        藏文会用<b>拉丁转写</b>读出近似读音（系统未提供藏语语音时）
      </div>
      <div id="ttsTranslit" class="result empty" style="margin-top:10px;display:none"></div>
    </div>
  </section>

</main>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js" defer></script>
<script>
/* ================================================================ 基础 */
const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));

function toast(msg, ms = 2200) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('on'), ms);
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ---------------- Tab 切换 ---------------- */
$('#tabs').addEventListener('click', (e) => {
  const b = e.target.closest('.tab');
  if (!b) return;
  const id = b.dataset.tab;
  $$('.tab').forEach((x) => x.classList.toggle('on', x === b));
  $$('.panel').forEach((p) => p.classList.toggle('on', p.id === 'panel-' + id));
});

/* ---------------- 状态 ---------------- */
let STATE = { hasKey: false, engine: 'bing', dict: {} };
async function loadStatus() {
  try {
    const r = await fetch('/api/status').then((x) => x.json());
    STATE = r;
    const badge = $('#statusBadge');
    const eng = r.engine === 'microsoft' ? '微软' : 'Bing';
    badge.innerHTML = '<span class="dot ok"></span>' + eng + ' 翻译就绪';
  } catch (e) {
    $('#statusBadge').innerHTML = '<span class="dot no"></span>服务未连接';
  }
}
loadStatus();

/* ================================================================ 词典 */
const dictInput = $('#dictInput');
const dictResult = $('#dictResult');

const SRC_LABEL = { words: '藏汉词典', big: '藏汉大辞典', terms: '新术语' };
const SRC_CLASS = { words: '', big: 'big', terms: 'terms' };

async function doDict() {
  const q = dictInput.value.trim();
  if (!q) return;
  dictResult.innerHTML = '<div class="empty-state"><p>查询中…</p></div>';
  try {
    const r = await fetch('/api/dict?q=' + encodeURIComponent(q)).then((x) => x.json());
    const items = r.items || [];
    $('#dictCount').textContent = items.length ? '（' + items.length + ' 条）' : '';
    if (!items.length) {
      dictResult.innerHTML =
        '<div class="empty-state"><div class="ic">🤔</div>' +
        '<p>没有找到「' + esc(q) + '」</p>' +
        '<p style="font-size:12px">试试换个写法，或用「翻译」功能</p></div>';
      return;
    }
    dictResult.innerHTML = items.map((it) => {
      const tag = SRC_LABEL[it.source] || it.source;
      const cls = SRC_CLASS[it.source] || '';
      return '<div class="ditem">' +
        '<div class="dhead">' +
          (it.bo ? '<span class="dbo bo">' + esc(it.bo) + '</span>' : '') +
          (it.zh ? '<span class="dzh">' + esc(it.zh) + '</span>' : '') +
          (it.py ? '<span class="dpy">' + esc(it.py) + '</span>' : '') +
          '<span class="dtag ' + cls + '">' + esc(tag) + '</span>' +
        '</div>' +
        (it.desc ? '<div class="dbody">' + esc(it.desc) + '</div>' : '') +
        (it.src ? '<div class="dsrc">来源：' + esc(it.src) + '</div>' : '') +
      '</div>';
    }).join('');
  } catch (e) {
    dictResult.innerHTML = '<div class="result err">查询失败：' + esc(e.message) + '</div>';
  }
}

$('#dictBtn').addEventListener('click', doDict);
dictInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') doDict(); });

$$('[data-src]').forEach((b) => {
  b.addEventListener('click', () => {
    const map = { big: '藏汉大辞典 收录', words: '藏汉词典 常用', terms: '新术语 现代词汇' };
    dictInput.value = '';
    dictInput.placeholder = map[b.dataset.src] + '——输入关键词';
    dictInput.focus();
  });
});

/* ================================================================ 翻译 */
const fromLang = $('#fromLang'), toLang = $('#toLang');
const transInput = $('#transInput'), transResult = $('#transResult');

$('#swapLang').addEventListener('click', () => {
  const a = fromLang.value, b = toLang.value;
  if (a === 'auto') return toast('自动检测无法交换');
  fromLang.value = b; toLang.value = a;
});

async function doTrans() {
  const text = transInput.value.trim();
  if (!text) return toast('请输入要翻译的内容');
  transResult.className = 'result';
  transResult.innerHTML = '<span class="spin dark"></span>翻译中…';
  try {
    const r = await fetch('/api/translate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, from: fromLang.value, to: toLang.value }),
    }).then((x) => x.json());

    if (!r.ok) {
      transResult.className = 'result err';
      transResult.textContent = '翻译失败：' + (r.hint || r.error || '未知错误');
      return;
    }
    transResult.className = 'result bo';
    transResult.textContent = r.text;
  } catch (e) {
    transResult.className = 'result err';
    transResult.textContent = '请求失败：' + e.message;
  }
}

$('#transBtn').addEventListener('click', doTrans);
$('#transClear').addEventListener('click', () => {
  transInput.value = '';
  transResult.className = 'result empty';
  transResult.textContent = '翻译结果会显示在这里';
});
$('#transCopy').addEventListener('click', () => {
  const t = transResult.textContent;
  if (!t) return;
  navigator.clipboard.writeText(t).then(() => toast('已复制')).catch(() => toast('复制失败'));
});
$('#transSpeak').addEventListener('click', () => {
  const t = transResult.textContent;
  if (t) speak(t, toLang.value === 'bo' ? 'bo' : 'zh-CN');
});
$('#transToDict').addEventListener('click', () => {
  const t = transResult.textContent.trim();
  if (!t) return;
  dictInput.value = t;
  $$('.tab').forEach((x) => x.classList.toggle('on', x.dataset.tab === 'dict'));
  $$('.panel').forEach((p) => p.classList.toggle('on', p.id === 'panel-dict'));
  doDict();
});

/* ================================================================ OCR */
const ocrDrop = $('#ocrDrop'), ocrFile = $('#ocrFile'), ocrPreview = $('#ocrPreview');
const ocrBtn = $('#ocrBtn'), ocrResult = $('#ocrResult');

let ocrBlob = null;
ocrDrop.addEventListener('click', () => ocrFile.click());
ocrDrop.addEventListener('dragover', (e) => { e.preventDefault(); ocrDrop.classList.add('over'); });
ocrDrop.addEventListener('dragleave', () => ocrDrop.classList.remove('over'));
ocrDrop.addEventListener('drop', (e) => {
  e.preventDefault();
  ocrDrop.classList.remove('over');
  const f = e.dataTransfer.files[0];
  if (f) takeImage(f);
});
ocrFile.addEventListener('change', () => {
  const f = ocrFile.files[0];
  if (f) takeImage(f);
});

function takeImage(f) {
  if (!/^image\//.test(f.type)) return toast('请选择图片文件');
  ocrBlob = f;
  const url = URL.createObjectURL(f);
  ocrPreview.src = url;
  ocrPreview.style.display = 'block';
  ocrBtn.disabled = false;
  ocrDrop.innerHTML = '<div>已选择：' + esc(f.name) + '</div><div style="font-size:12px;opacity:.7">点击可重新选择</div>';
}

ocrBtn.addEventListener('click', async () => {
  if (!ocrBlob) return;
  if (typeof Tesseract === 'undefined') {
    return toast('识别引擎未加载，请检查网络后刷新');
  }
  ocrResult.className = 'result';
  ocrResult.innerHTML = '<span class="spin dark"></span>识别中（首次需下载语言包）…';
  ocrBtn.disabled = true;

  try {
    const langs = $('#ocrLang').value;
    const { data } = await Tesseract.recognize(ocrBlob, langs, {
      logger: (m) => {
        if (m.status === 'recognizing text') {
          ocrResult.innerHTML = '<span class="spin dark"></span>识别中… ' + Math.round(m.progress * 100) + '%';
        } else if (m.status && m.progress != null) {
          ocrResult.innerHTML = '<span class="spin dark"></span>' + esc(m.status) + ' ' + Math.round(m.progress * 100) + '%';
        }
      },
    });
    const text = (data.text || '').trim();
    if (!text) {
      ocrResult.className = 'result empty';
      ocrResult.textContent = '没有识别到文字，试试更清晰的图片';
    } else {
      ocrResult.className = 'result bo';
      ocrResult.textContent = text;
      transInput.value = text;
      toast('识别完成，可直接翻译');
    }
    $('#ocrHint').textContent = '识别完成 · 置信度 ' + Math.round(data.confidence || 0) + '%';
  } catch (e) {
    ocrResult.className = 'result err';
    ocrResult.textContent = '识别失败：' + e.message;
  } finally {
    ocrBtn.disabled = false;
  }
});

/* ================================================================ 语音识别 */
const micBtn = $('#micBtn'), micHint = $('#micHint'), asrResult = $('#asrResult');
let recog = null, recording = false;

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) {
  micBtn.disabled = true;
  micHint.textContent = '当前浏览器不支持语音识别（建议用 Chrome / Edge）';
} else {
  recog = new SR();
  recog.lang = 'zh-CN';
  recog.continuous = true;
  recog.interimResults = true;

  let finalText = '';

  recog.onstart = () => {
    recording = true;
    micBtn.classList.add('on');
    micHint.textContent = '正在聆听…再点一次停止';
    finalText = '';
    asrResult.className = 'result';
  };
  recog.onresult = (ev) => {
    let interim = '';
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const r = ev.results[i];
      if (r.isFinal) finalText += r[0].transcript;
      else interim += r[0].transcript;
    }
    asrResult.textContent = finalText + interim;
  };
  recog.onerror = (e) => {
    micHint.textContent = '识别出错：' + e.error;
    micBtn.classList.remove('on');
    recording = false;
  };
  recog.onend = () => {
    micBtn.classList.remove('on');
    recording = false;
    micHint.textContent = finalText ? '识别完成' : '点击开始说话';
  };

  micBtn.addEventListener('click', () => {
    if (recording) { recog.stop(); return; }
    try { recog.start(); } catch (e) { micHint.textContent = '启动失败：' + e.message; }
  });
}

$('#asrCopy').addEventListener('click', () => {
  const t = asrResult.textContent;
  if (t) navigator.clipboard.writeText(t).then(() => toast('已复制'));
});
$('#asrTrans').addEventListener('click', () => {
  const t = asrResult.textContent.trim();
  if (!t) return toast('还没有识别内容');
  transInput.value = t;
  $$('.tab').forEach((x) => x.classList.toggle('on', x.dataset.tab === 'trans'));
  $$('.panel').forEach((p) => p.classList.toggle('on', p.id === 'panel-trans'));
  doTrans();
});

/* ================================================================ TTS */
const ttsInput = $('#ttsInput'), ttsVoice = $('#ttsVoice');
const ttsRate = $('#ttsRate'), ttsRateVal = $('#ttsRateVal');

function loadVoices() {
  if (!window.speechSynthesis) return;
  const vs = speechSynthesis.getVoices();
  ttsVoice.innerHTML = vs.map((v, i) =>
    '<option value="' + i + '">' + esc(v.name) + ' (' + esc(v.lang) + ')</option>').join('');
  // 优先选中文/藏文
  const idx = vs.findIndex((v) => /^bo/i.test(v.lang));
  if (idx >= 0) ttsVoice.value = String(idx);
  else {
    const zh = vs.findIndex((v) => /^zh/i.test(v.lang));
    if (zh >= 0) ttsVoice.value = String(zh);
  }
}
if (window.speechSynthesis) {
  speechSynthesis.onvoiceschanged = loadVoices;
  loadVoices();
}

ttsRate.addEventListener('input', () => {
  ttsRateVal.textContent = Number(ttsRate.value).toFixed(1) + '×';
});

/* ---------------- 藏文 → 近似发音（音节级转写） ----------------
 * 系统与主流平台均无藏语 TTS 语音，这里按藏文拼读规则转写，
 * 再交给拉丁语音读出近似读音。
 *
 * 规则：
 *   1) 以 ་ / 空格 / ། 切分音节
 *   2) 音节的元音符号决定韵母，无元音符号则默认 'a'
 *   3) 声母里的前加字（ག ད བ མ འ）在口语中不发音，省略
 *   4) 下加字与基字合流（ྲ→r, ླ→l, ྭ→w, ྱ→y）
 *   5) 后加字按口语弱化（ད བ ལ ས འ 不发音，ག→k, ང→ng, ན→n, མ→m, ར→r）
 */
const CONS_BASE = {
  '\u0F40': 'k', '\u0F41': 'kh', '\u0F42': 'g', '\u0F43': 'gh', '\u0F44': 'ng',
  '\u0F45': 'ch', '\u0F46': 'chh', '\u0F47': 'j', '\u0F49': 'ny',
  '\u0F4A': 't', '\u0F4B': 'th', '\u0F4C': 'd', '\u0F4D': 'dh', '\u0F4E': 'n',
  '\u0F4F': 't', '\u0F50': 'th', '\u0F51': 'd', '\u0F52': 'dh', '\u0F53': 'n',
  '\u0F54': 'p', '\u0F55': 'ph', '\u0F56': 'b', '\u0F57': 'bh', '\u0F58': 'm',
  '\u0F59': 'ts', '\u0F5A': 'tsh', '\u0F5B': 'dz', '\u0F5C': 'dzh',
  '\u0F5D': 'w', '\u0F5E': 'zh', '\u0F5F': 'z', '\u0F60': '',
  '\u0F61': 'y', '\u0F62': 'r', '\u0F63': 'l', '\u0F64': 'sh', '\u0F65': 's',
  '\u0F66': 's', '\u0F67': 'h', '\u0F68': '',
};
// 下加字
const SUBJOIN = {
  '\u0F90': 'k', '\u0F91': 'kh', '\u0F92': 'g', '\u0F94': 'ng',
  '\u0F95': 'ch', '\u0F96': 'chh', '\u0F97': 'j', '\u0F99': 'ny',
  '\u0F9A': 't', '\u0F9B': 'th', '\u0F9C': 'd', '\u0F9E': 'n',
  '\u0F9F': 't', '\u0FA0': 'th', '\u0FA1': 'd', '\u0FA3': 'n',
  '\u0FA4': 'p', '\u0FA5': 'ph', '\u0FA6': 'b', '\u0FA8': 'm',
  '\u0FA9': 'ts', '\u0FAA': 'tsh', '\u0FAB': 'dz',
  '\u0FAD': 'w', '\u0FAE': 'zh', '\u0FAF': 'z', '\u0FB0': '',
  '\u0FB1': 'y', '\u0FB2': 'r', '\u0FB3': 'l', '\u0FB4': 'sh',
  '\u0FB5': 's', '\u0FB6': 's', '\u0FB7': 'h', '\u0FB8': '',
};
// 元音符号 → 韵母
const VOWEL = {
  '\u0F71': 'a', '\u0F72': 'i', '\u0F73': 'i', '\u0F74': 'u', '\u0F75': 'u',
  '\u0F76': 'i', '\u0F77': 'i', '\u0F78': 'i', '\u0F79': 'i',
  '\u0F7A': 'e', '\u0F7B': 'e', '\u0F7C': 'o', '\u0F7D': 'o',
  '\u0F7E': 'n', '\u0F7F': 'h', '\u0F80': 'i', '\u0F81': 'i',
};
// 后加字口语读音（空 = 不发音）
const SUFFIX = {
  '\u0F42': 'k',   // ག
  '\u0F44': 'ng',  // ང
  '\u0F51': '',    // ད
  '\u0F53': 'n',   // ན
  '\u0F56': '',    // བ
  '\u0F58': 'm',   // མ
  '\u0F60': '',    // འ
  '\u0F62': 'r',   // ར
  '\u0F63': '',    // ལ
  '\u0F66': '',    // ས
};
// 前加字（口语不发音）
const PREFIX = new Set(['\u0F42', '\u0F51', '\u0F56', '\u0F58', '\u0F60']);
// 音节分隔符
const TSEG = new Set(['\u0F0B', '\u0F0C', '\u0F0D', '\u0F0E', '\u0F0F', '\u0F11', '\u0F14', ' ', '\u0F3A', '\u0F3B', '\u0F3C', '\u0F3D']);

function isTibetan(ch) {
  const c = ch.codePointAt(0);
  return c >= 0x0F00 && c <= 0x0FFF;
}
function hasTibetan(text) {
  for (const ch of text) if (isTibetan(ch)) return true;
  return false;
}

/** 转写单个藏文音节 */
function tibSyllable(chars) {
  if (!chars.length) return '';

  // 1) 先定位元音符号
  let vi = -1;
  for (let i = 0; i < chars.length; i++) {
    if (VOWEL[chars[i]] !== undefined) { vi = i; break; }
  }

  let head, tail, vowel;

  if (vi >= 0) {
    // 有元音符号：元音前是声母部分，元音后是后加字
    head = chars.slice(0, vi);
    tail = chars.slice(vi + 1);
    vowel = VOWEL[chars[vi]];
  } else {
    // 无元音符号：从末尾剥离后加字，韵母默认 'a'
    head = chars.slice();
    tail = [];
    vowel = 'a';

    const isSuffix = (ch) => SUFFIX[ch] !== undefined;
    const isSecondSuffix = (ch) => ch === '\u0F66' || ch === '\u0F51'; // ས / ད

    // 先试两个后加字（再后加字）
    if (head.length >= 3 && isSuffix(head[head.length - 1]) &&
        isSecondSuffix(head[head.length - 1]) && isSuffix(head[head.length - 2])) {
      tail = head.slice(-2);
      head = head.slice(0, -2);
    } else if (head.length >= 2 && isSuffix(head[head.length - 1])) {
      tail = [head[head.length - 1]];
      head = head.slice(0, -1);
    }
  }

  // 2) 组装声母：去掉前加字（仅当其后不是下加字时）
  let cons = head.slice();
  if (cons.length >= 2 && PREFIX.has(cons[0]) && SUBJOIN[cons[1]] === undefined) {
    cons = cons.slice(1);
  }

  let onset = '';
  for (let i = 0; i < cons.length; i++) {
    const ch = cons[i];
    const nxt = cons[i + 1];
    const hasSub = nxt !== undefined && SUBJOIN[nxt] !== undefined;

    if (CONS_BASE[ch] !== undefined) {
      const b = CONS_BASE[ch];
      if (hasSub) {
        const sub = SUBJOIN[nxt];
        // 常见连读合流
        if (b === 'r' && sub === 'l') { onset += 'l'; i++; continue; }
        if (b === 'l' && sub === 'h') { onset += 'lh'; i++; continue; }
        if (b === 's' && sub === 'r') { onset += 'sr'; i++; continue; }
        onset += b + sub;
        i++;
        continue;
      }
      onset += b;
    } else if (SUBJOIN[ch] !== undefined) {
      onset += SUBJOIN[ch];
    }
  }

  // 3) 韵尾
  let coda = '';
  for (const ch of tail) {
    const s = SUFFIX[ch];
    if (s !== undefined) coda += s;
    else if (CONS_BASE[ch] !== undefined) coda += CONS_BASE[ch];
  }

  const syl = onset + vowel + coda;
  return syl;
}

/**
 * 藏文 → 可朗读的拉丁音节串
 * 非藏文字符原样保留（中英混排不受影响）
 */
function tibetanToPhonetic(text) {
  let out = '';
  let buf = [];

  const flush = () => {
    if (buf.length) {
      const s = tibSyllable(buf);
      if (s) out += s + ' ';
      buf = [];
    }
  };

  for (const ch of text) {
    if (isTibetan(ch)) {
      if (TSEG.has(ch)) { flush(); out += ' '; }
      else buf.push(ch);
    } else {
      flush();
      out += ch;
    }
  }
  flush();

  return out.replace(/\s+/g, ' ').trim();
}

function speak(text, langHint) {
  if (!window.speechSynthesis) return toast('当前浏览器不支持朗读');
  speechSynthesis.cancel();

  let toSpeak = text;
  let note = '';

  if (hasTibetan(text)) {
    // 系统无藏语语音 → 用转写 + 拉丁语音朗读
    toSpeak = tibetanToPhonetic(text);
    note = '藏文按拉丁转写近似朗读';
    // 转写后优先找英文语音（拉丁字母发音更准）
    const vs0 = speechSynthesis.getVoices();
    const en = vs0.find((v) => /^en/i.test(v.lang));
    const u = new SpeechSynthesisUtterance(toSpeak);
    if (en) { u.voice = en; u.lang = en.lang; }
    u.rate = (Number(ttsRate.value) || 1) * 0.9;
    u.onend = () => { /* 完成 */ };
    speechSynthesis.speak(u);
    toast(note + '（系统无藏语语音）', 3200);
    return;
  }

  const u = new SpeechSynthesisUtterance(toSpeak);
  const vs = speechSynthesis.getVoices();
  const i = Number(ttsVoice.value);
  if (vs[i]) { u.voice = vs[i]; u.lang = vs[i].lang; }
  else if (langHint) u.lang = langHint;
  u.rate = Number(ttsRate.value) || 1;
  speechSynthesis.speak(u);
}

$('#ttsPlay').addEventListener('click', () => {
  const t = ttsInput.value.trim();
  if (!t) return toast('请输入要朗读的文字');

  // 显示转写预览，让用户看到实际会读出的音节
  const box = $('#ttsTranslit');
  if (hasTibetan(t)) {
    const ph = tibetanToPhonetic(t);
    box.style.display = 'block';
    box.className = 'result';
    box.innerHTML = '<div style="font-size:12px;color:#6b7688;margin-bottom:5px">拉丁转写预览</div>' +
                    '<div style="font-family:ui-monospace,monospace;color:#2f7cf6">' + esc(ph) + '</div>';
    speak(t);
  } else {
    box.style.display = 'none';
    speak(t);
  }
});
$('#ttsStop').addEventListener('click', () => {
  speechSynthesis.cancel();
  const box = $('#ttsTranslit');
  box.style.display = 'none';
});

/* ================================================================ 启动 */
setTimeout(loadStatus, 500);
</script>
</body>
</html>
